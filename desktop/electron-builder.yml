# How the desktop app is packed. See "The desktop app" in DEVELOPMENT.md.
appId: app.hireme.desktop
productName: HireMe
copyright: Free software under the AGPL-3.0
directories:
  output: release
files:
  - dist/**
  - package.json
# What "On this computer" runs. Copied by a script, because extraResources quietly
# leaves out every node_modules folder.
afterPack: scripts/after-pack.mjs
artifactName: HireMe-${version}-${os}-${arch}.${ext}
# GitHub releases feed electron-updater; CI still builds with --publish never and
# uploads assets itself. Mac builds are unsigned (no Apple Developer ID).
publish:
  provider: github
  owner: Realtime-Coding
  repo: HireMe
linux:
  category: Office
  # The window belongs to the menu entry the .deb installs, hireme-desktop.desktop.
  syncDesktopName: true
  icon: assets/icon.png
  # AppImage for any distribution, and .deb since Ubuntu 24.04's AppArmor can break AppImage's sandbox.
  target: [AppImage, deb]
win:
  icon: assets/icon.png
  target: [nsis]
nsis:
  # For this user, with no admin rights needed, and a new version installs over the old one.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.productivity
  icon: assets/icon.png
  # Unsigned: first open may need right-click → Open. zip is what electron-updater replaces.
  identity: null
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
