services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dossier
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${DOSSIER_IMAGE:-dossier:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD}@db:5432/dossier?connect_timeout=15&pool_timeout=15
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set DOSSIER_PASSWORD in .env to a hash from hash-password}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set DOSSIER_SECRET in .env}
      DOSSIER_BACKUP_RETENTION_DAYS: ${DOSSIER_BACKUP_RETENTION_DAYS:-}
      TZ: ${TZ:-UTC}
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_AI_ENDPOINT: ${DOSSIER_AI_ENDPOINT:-}
      DOSSIER_AI_KEY: ${DOSSIER_AI_KEY:-}
      DOSSIER_AI_TIMEOUT_SECONDS: ${DOSSIER_AI_TIMEOUT_SECONDS:-}
      DOSSIER_TELEMETRY: ${DOSSIER_TELEMETRY:-}
      DOSSIER_JOBS_SOURCE: ${DOSSIER_JOBS_SOURCE:-}
      DOSSIER_JSEARCH_KEY: ${DOSSIER_JSEARCH_KEY:-}
      DOSSIER_JSEARCH_HOST: ${DOSSIER_JSEARCH_HOST:-}
      DOSSIER_ADZUNA_APP_ID: ${DOSSIER_ADZUNA_APP_ID:-}
      DOSSIER_ADZUNA_KEY: ${DOSSIER_ADZUNA_KEY:-}
      DOSSIER_FREEHIRE_URL: ${DOSSIER_FREEHIRE_URL:-}
      DOSSIER_AGENTREACH_URL: ${DOSSIER_AGENTREACH_URL:-http://agentreach:8085}
      DOSSIER_AGENTREACH_KEY: ${DOSSIER_AGENTREACH_KEY:-}
      DOSSIER_JOBS_ARBEITSAGENTUR: ${DOSSIER_JOBS_ARBEITSAGENTUR:-}
      DOSSIER_SCORER: ${DOSSIER_SCORER:-}
      DOSSIER_TYPESAFE_KEY: ${DOSSIER_TYPESAFE_KEY:-}
      DOSSIER_GOOGLE_CLIENT_ID: ${DOSSIER_GOOGLE_CLIENT_ID:-}
      DOSSIER_GOOGLE_CLIENT_SECRET: ${DOSSIER_GOOGLE_CLIENT_SECRET:-}
      DOSSIER_PUBLIC_URL: ${DOSSIER_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${DOSSIER_PORT:-3001}:3000"
    volumes:
      - data:/data
    mem_limit: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agentreach:
    image: node:24-alpine
    restart: unless-stopped
    volumes:
      - ./services/agentreach:/app
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "127.0.0.1:8085:8085"

volumes:
  pgdata:
  data: