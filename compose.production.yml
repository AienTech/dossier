# HireMe with Docker Compose (see the installation guide, https://github.com/shahzadafridi/HireMe/wiki). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# HIREME_PASSWORD (a hash of your password, from `docker run --rm -it
# ghcr.io/shahzadafridi/hireme hash-password`) and HIREME_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hireme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hireme
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireme -d hireme"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${HIREME_IMAGE:-ghcr.io/shahzadafridi/hireme:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hireme:${POSTGRES_PASSWORD}@db:5432/hireme
      HIREME_PASSWORD: ${HIREME_PASSWORD:?Set HIREME_PASSWORD in .env to a hash from hash-password}
      HIREME_SECRET: ${HIREME_SECRET:?Set HIREME_SECRET in .env}
      HIREME_BACKUP_RETENTION_DAYS: ${HIREME_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      HIREME_AI_PROVIDER: ${HIREME_AI_PROVIDER:-}
      HIREME_AI_URL: ${HIREME_AI_URL:-}
      HIREME_AI_MODEL: ${HIREME_AI_MODEL:-}
      HIREME_AI_KEY: ${HIREME_AI_KEY:-}
      HIREME_AI_TIMEOUT_SECONDS: ${HIREME_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, HireMe asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      HIREME_TELEMETRY: ${HIREME_TELEMETRY:-}
      # Defaults for Settings → Job search.
      HIREME_JOBS_SOURCE: ${HIREME_JOBS_SOURCE:-}
      HIREME_JSEARCH_KEY: ${HIREME_JSEARCH_KEY:-}
      HIREME_JSEARCH_HOST: ${HIREME_JSEARCH_HOST:-}
      HIREME_ADZUNA_APP_ID: ${HIREME_ADZUNA_APP_ID:-}
      HIREME_ADZUNA_KEY: ${HIREME_ADZUNA_KEY:-}
      HIREME_FREEHIRE_URL: ${HIREME_FREEHIRE_URL:-}
      HIREME_JOBS_ARBEITSAGENTUR: ${HIREME_JOBS_ARBEITSAGENTUR:-}
      # Defaults for Settings → Scoring: ai or jev (Jev by TypeSafe, with its key).
      HIREME_SCORER: ${HIREME_SCORER:-}
      HIREME_TYPESAFE_KEY: ${HIREME_TYPESAFE_KEY:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      HIREME_GOOGLE_CLIENT_ID: ${HIREME_GOOGLE_CLIENT_ID:-}
      HIREME_GOOGLE_CLIENT_SECRET: ${HIREME_GOOGLE_CLIENT_SECRET:-}
      # The address HireMe is reached at, for Google's redirect.
      HIREME_PUBLIC_URL: ${HIREME_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${HIREME_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). HireMe reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
