# Dependency updates (E11-5): once a week, grouped so each ecosystem opens
# one pull request for minor and patch updates. Major updates come one by
# one, since they usually need code changes. Security updates are always
# opened right away (enable Dependabot security updates in the repository's
# settings).
version: 2
updates:
  - package-ecosystem: npm # Yarn 4, through package.json and yarn.lock
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        update-types: [minor, patch]
    # Majors held back on purpose (decided 29 September 2026). Remove a rule
    # when its reason no longer holds.
    ignore:
      # Node's types follow the Node LTS the image runs (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react (through eslint-config-next) breaks on ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker # the Node base image in Dockerfile
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stays on the Node LTS (24) until moving to the next one is decided.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose # Postgres and Ollama in compose.yml
    directory: /
    schedule:
      interval: weekly
